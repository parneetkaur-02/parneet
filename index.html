<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="weather-container">
        <div class="weather-card">
            <!-- Title at the Top -->
            <h1 class="app-title">Weather Forecasts</h1>

            <!-- Image inside the box -->
            <div class="image-container">
                <img src="https://i.pinimg.com/736x/2c/9e/be/2c9ebe7fa5ef1238d810327396f3d050.jpg" alt="Weather Image">
            </div>

            <!-- "Let's Start" Button at the Bottom -->
            <div class="start-button">
                <button class="start-btn" onclick="goToSearch()">Let's Start →</button>
            </div>
        </div>
    </div>

    <script>
        function goToSearch() {
            window.location.href = "search.html"; // Navigates to search page
        }
    </script>
</body>
</html>
